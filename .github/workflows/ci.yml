name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
